services:
  server:
    build: .
    restart: unless-stopped
    command:
      - --bind
      - 0.0.0.0
      - --port
      - "27301"
      - --api-port
      - "27302"
      - --api-bind
      - 0.0.0.0
      - --trust-proxy-client-ip
      - --database
      - /var/lib/tenriff/tenriff.sqlite3
      - --receipt-secret-file
      - /run/secrets/receipt-secret
      - --verifier
      - /opt/tenriff/tenriff-replay-verifier
      - --replay-staging
      - /var/lib/tenriff/replay-staging
      - --catalog-file
      - /etc/tenriff/generated-bms-catalog.txt
      - --name
      - ${TENRIFF_SERVER_NAME:-TenRiff Ranked Server}
    ports:
      - "27301:27301/tcp"
      - "127.0.0.1:27302:27302/tcp"
    expose:
      - "27302"
    volumes:
      - tenriff-data:/var/lib/tenriff
      - ./runtime:/opt/tenriff:ro
      - "${TENRIFF_CHARTS_PATH:-./catalog}:/charts:ro"
      - ./catalog/generated-bms-catalog.txt:/etc/tenriff/generated-bms-catalog.txt:ro
    environment:
      TENRIFF_NK3_BACKEND: NCNN_CPU
      LD_LIBRARY_PATH: /opt/tenriff/lib
    secrets:
      - receipt-secret
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      - server
    environment:
      TENRIFF_DOMAIN: ${TENRIFF_DOMAIN:-localhost}
    ports:
      - "27303:443/tcp"
      - "27303:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

volumes:
  tenriff-data:
  caddy-data:
  caddy-config:

secrets:
  receipt-secret:
    file: ./secrets/receipt-secret
