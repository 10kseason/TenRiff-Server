name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    strategy:
      matrix:
        include:
          - os: windows-2022
            artifact: TenRiff-Server-windows-x64
          - os: ubuntu-24.04
            artifact: TenRiff-Server-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev libssl-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DTENRIFF_SERVER_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Stage Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path stage/TenRiff-Server | Out-Null
          Copy-Item build/Release/tenriff-server.exe stage/TenRiff-Server/
          Copy-Item README.md,SECURITY.md,LICENSE,Caddyfile,compose.yaml,.env.example stage/TenRiff-Server/
          Copy-Item catalog,tools -Destination stage/TenRiff-Server -Recurse
          Compress-Archive stage/TenRiff-Server -DestinationPath "${{ matrix.artifact }}.zip"
          (Get-FileHash "${{ matrix.artifact }}.zip" -Algorithm SHA256).Hash.ToLower() +
            "  ${{ matrix.artifact }}.zip" | Set-Content "${{ matrix.artifact }}.sha256" -Encoding ascii
      - name: Stage Linux archive
        if: runner.os == 'Linux'
        run: |
          mkdir -p stage/TenRiff-Server
          cp build/tenriff-server README.md SECURITY.md LICENSE Caddyfile compose.yaml .env.example stage/TenRiff-Server/
          cp -r catalog tools stage/TenRiff-Server/
          tar -C stage -czf "${{ matrix.artifact }}.tar.gz" TenRiff-Server
          sha256sum "${{ matrix.artifact }}.tar.gz" > "${{ matrix.artifact }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.*

  windows-arm64:
    runs-on: windows-11-arm
    env:
      CLIENT_COMMIT: 358b04fa73b45f76f9e01970d2fcea1fa2b3eef8
      NCNN_ARCHIVE: ncnn-20260526-windows-vs2022-shared.zip
      NCNN_SHA256: bd44f73ff210d523368ca77badfc8ae528281cb374185717c03b472d4f5a1754
      ARTIFACT_NAME: TenRiff-Server-windows-arm64
    steps:
      - uses: actions/checkout@v4
      - name: Check out the matching replay verifier
        uses: actions/checkout@v4
        with:
          repository: 10kseason/TenRiff
          ref: ${{ env.CLIENT_COMMIT }}
          path: TenRiff-client
      - name: Download verified ARM64 ncnn Vulkan runtime
        shell: pwsh
        run: |
          $uri = "https://github.com/Tencent/ncnn/releases/download/20260526/$env:NCNN_ARCHIVE"
          Invoke-WebRequest -Uri $uri -OutFile $env:NCNN_ARCHIVE
          $actual = (Get-FileHash -LiteralPath $env:NCNN_ARCHIVE -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $env:NCNN_SHA256) {
            throw "ncnn SHA-256 mismatch: $actual"
          }
          Expand-Archive -LiteralPath $env:NCNN_ARCHIVE -DestinationPath ncnn-package
          $root = (Resolve-Path "ncnn-package/ncnn-20260526-windows-vs2022-shared/arm64").Path
          "NCNN_ARM64_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Configure ARM64 server
        run: >-
          cmake -S . -B build-arm64 -G "Visual Studio 17 2022" -A ARM64
          -DTENRIFF_SERVER_BUILD_TESTS=ON
      - name: Build and test ARM64 server
        shell: pwsh
        run: |
          cmake --build build-arm64 --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build-arm64 -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Configure ARM64 replay verifier with ncnn Vulkan
        shell: pwsh
        run: |
          cmake -S TenRiff-client -B client-build-arm64 -G "Visual Studio 17 2022" -A ARM64 `
            -DTENRIFF_ENABLE_TESTS=ON `
            -DTENRIFF_ENABLE_ONNX_UPSCALER=OFF `
            -DTENRIFF_ENABLE_NK3_ONNX=ON `
            -DTENRIFF_ENABLE_NK3_NCNN=ON `
            "-Dncnn_DIR=$env:NCNN_ARM64_ROOT/lib/cmake/ncnn"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and CPU-smoke ARM64 replay verifier
        shell: pwsh
        run: |
          cmake --build client-build-arm64 --config Release --parallel `
            --target tenriff_replay_verifier nk3_onnx_smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:TENRIFF_NK3_BACKEND = "NCNN_CPU"
          ctest --test-dir client-build-arm64 -C Release `
            -R "^nk3_onnx_smoke$" --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify ARM64 PE machine type
        shell: pwsh
        run: |
          $paths = @(
            "build-arm64/Release/tenriff-server.exe",
            "client-build-arm64/Release/tenriff-replay-verifier.exe",
            "client-build-arm64/Release/ncnn.dll",
            "client-build-arm64/Release/nk3_onnx_smoke.exe"
          )
          foreach ($path in $paths) {
            ./tools/verify-pe-machine.ps1 -Path $path -ExpectedMachine ARM64
          }
      - name: Stage Windows ARM64 Snapdragon archive
        shell: pwsh
        run: |
          $stage = "stage/TenRiff-Server"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item build-arm64/Release/tenriff-server.exe $stage/
          Copy-Item client-build-arm64/Release/tenriff-replay-verifier.exe $stage/
          Copy-Item client-build-arm64/Release/ncnn.dll $stage/
          Copy-Item client-build-arm64/Release/nk3_onnx_smoke.exe $stage/
          Copy-Item client-build-arm64/Release/models -Destination $stage -Recurse
          Copy-Item README.md,README-SNAPDRAGON.md,SECURITY.md,LICENSE,Caddyfile,compose.yaml,.env.example $stage/
          Copy-Item catalog,tools -Destination $stage -Recurse
          $notice = "$stage/third_party/ncnn-20260526"
          New-Item -ItemType Directory -Path $notice -Force | Out-Null
          Copy-Item TenRiff-client/third_party/ncnn-20260526/LICENSE.txt $notice/
          Compress-Archive $stage -DestinationPath "$env:ARTIFACT_NAME.zip"
          (Get-FileHash "$env:ARTIFACT_NAME.zip" -Algorithm SHA256).Hash.ToLower() +
            "  $env:ARTIFACT_NAME.zip" | Set-Content "$env:ARTIFACT_NAME.sha256" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            ${{ env.ARTIFACT_NAME }}.*

  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/tenriff-server
          tags: |
            type=ref,event=tag
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish:
    needs: [binaries, windows-arm64, container]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: TenRiff-Server-*
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
