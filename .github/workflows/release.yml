name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    strategy:
      matrix:
        include:
          - os: windows-2022
            artifact: TenRiff-Server-windows-x64
          - os: ubuntu-24.04
            artifact: TenRiff-Server-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev libssl-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DTENRIFF_SERVER_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Stage Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path stage/TenRiff-Server | Out-Null
          Copy-Item build/Release/tenriff-server.exe stage/TenRiff-Server/
          Copy-Item README.md,SECURITY.md,LICENSE,Caddyfile,compose.yaml,.env.example stage/TenRiff-Server/
          Copy-Item catalog,tools -Destination stage/TenRiff-Server -Recurse
          Compress-Archive stage/TenRiff-Server -DestinationPath "${{ matrix.artifact }}.zip"
          (Get-FileHash "${{ matrix.artifact }}.zip" -Algorithm SHA256).Hash.ToLower() +
            "  ${{ matrix.artifact }}.zip" | Set-Content "${{ matrix.artifact }}.sha256" -Encoding ascii
      - name: Stage Linux archive
        if: runner.os == 'Linux'
        run: |
          mkdir -p stage/TenRiff-Server
          cp build/tenriff-server README.md SECURITY.md LICENSE Caddyfile compose.yaml .env.example stage/TenRiff-Server/
          cp -r catalog tools stage/TenRiff-Server/
          tar -C stage -czf "${{ matrix.artifact }}.tar.gz" TenRiff-Server
          sha256sum "${{ matrix.artifact }}.tar.gz" > "${{ matrix.artifact }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.*

  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/tenriff-server
          tags: |
            type=ref,event=tag
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish:
    needs: [binaries, container]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
