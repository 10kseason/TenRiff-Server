name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    strategy:
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev libssl-dev
      - name: Configure
        run: cmake -S . -B build -DTENRIFF_SERVER_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  asan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev libssl-dev
      - name: Configure ASan
        run: >-
          cmake -S . -B build-asan
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DTENRIFF_SERVER_BUILD_TESTS=ON
          -DTENRIFF_SERVER_ENABLE_ASAN=ON
      - name: Build ASan
        run: cmake --build build-asan --parallel
      - name: Test ASan
        run: ctest --test-dir build-asan --output-on-failure

  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build tested runtime image
        run: docker build --tag tenriff-server:${{ github.sha }} .
      - name: Scan runtime image
        uses: aquasecurity/trivy-action@0.32.0
        with:
          image-ref: tenriff-server:${{ github.sha }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH
